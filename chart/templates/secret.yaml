{{- if and .Values.admin.enabled (not .Values.admin.existingSecret) }}
{{- if lt (len .Values.admin.token) 16 }}
{{- fail "admin.enabled needs admin.existingSecret, or admin.token of at least 16 characters" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-admin
type: Opaque
stringData:
  {{ .Values.admin.secretKey }}: {{ .Values.admin.token | quote }}
{{- end }}
