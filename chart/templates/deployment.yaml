{{- if and .Values.admin.enabled .Values.persistence.existingClaim (gt (int .Values.replicas) 1) }}
{{- fail "persistence.existingClaim needs replicas: 1 (replicas must not share one overrides file)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: { app: {{ .Release.Name }} }
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app: {{ .Release.Name }} }
      annotations:
        checksum/flags: {{ toYaml .Values.flags | sha256sum }}
    spec:
      securityContext:
        # The image runs as 1001:1001; fsGroup makes a mounted volume
        # (persistence.existingClaim) writable for the overrides file.
        runAsNonRoot: true
        fsGroup: 1001
      containers:
        - name: relay
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          env:
            - { name: FLAGS_FILE, value: /etc/flags/flags.yaml }
            - { name: PORT, value: "{{ .Values.port }}" }
            - { name: SDK_KEY, value: "{{ .Values.sdkKey }}" }
            {{- if .Values.admin.enabled }}
            - { name: ADMIN_PORT, value: "{{ .Values.admin.port }}" }
            - name: RELAY_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret | default (printf "%s-admin" .Release.Name) }}
                  key: {{ .Values.admin.secretKey }}
            - { name: CACHE_DIR, value: "{{ .Values.persistence.mountPath }}" }
            - { name: PEER_PORT, value: "{{ .Values.peerPort }}" }
            - { name: PEER_DNS, value: "{{ .Release.Name }}-peer.{{ .Release.Namespace }}.svc.cluster.local" }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            {{- end }}
          ports:
            - { name: sdk, containerPort: {{ .Values.port }} }
            {{- if .Values.admin.enabled }}
            - { name: admin, containerPort: {{ .Values.admin.port }} }
            - { name: peer, containerPort: {{ .Values.peerPort }} }
            {{- end }}
          volumeMounts:
            - { name: flags, mountPath: /etc/flags, readOnly: true }
            {{- if .Values.admin.enabled }}
            - { name: data, mountPath: "{{ .Values.persistence.mountPath }}" }
            {{- end }}
          readinessProbe:
            httpGet: { path: /health, port: {{ .Values.port }} }
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: flags
          configMap: { name: {{ .Release.Name }}-flags }
        {{- if .Values.admin.enabled }}
        - name: data
          {{- if .Values.persistence.existingClaim }}
          persistentVolumeClaim: { claimName: {{ .Values.persistence.existingClaim }} }
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
