name: Test and coverage
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Fetch verified report client
        if: github.ref == 'refs/heads/main'
        run: |
          curl -fsS https://coverage.biswas.me/ci/report-v1.py -o "$RUNNER_TEMP/project-quality-report.py"
          echo "620701586b18553b55b6eb0bc964a7a0dcef82f04f989b9f010b18947ebc746a  $RUNNER_TEMP/project-quality-report.py" | sha256sum --check --status
      - name: Publish application coverage
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          COVERAGE_TOKEN: ${{ secrets.COVERAGE_TOKEN }}
          COVERAGE_REPO: flag-file-relay
          COVERAGE_GROUP: flag-file-relay
          COVERAGE_LANGUAGE: go
          COVERAGE_SOURCE_ROOT: ''
        run: |
          export COVERAGE_GO_MODULE=$(sed -n "s/^module //p" go.mod)
          python3 "$RUNNER_TEMP/project-quality-report.py" coverage coverage.out

      - name: Preserve application quality report
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-coverage-application
          path: coverage.out
          if-no-files-found: error
          retention-days: 7
